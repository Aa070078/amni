name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Tenant isolation suite (TESTING.md 5): in-repo harness (mock-frappe-server)
  # that exercises cross-tenant 403/404 guarantees over a real HTTP client.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:isolation

  security-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Merge to dev/main gate: verify migrations + seed against a real Postgres, then run
  # the full suite (unit + the in-repo tenant isolation harness, TESTING.md 3-5).
  # The ERPNext supertest tier against a real frappe_docker bench (TESTING.md 4)
  # and the Playwright e2e suite (TESTING.md 6) are not wired yet: the bench is not
  # reachable in CI (provisioning is paused). They slot in below once the cluster
  # is available.
  integration:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amni
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amni
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: Migrate + generate client + seed
        run: pnpm --filter db run deploy && pnpm --filter db run generate && pnpm db:seed
      - name: Full suite
        run: pnpm test
      - name: Tenant isolation suite
        run: pnpm test:isolation
      # TODO(M5-007): ERPNext supertest integration against a frappe_docker bench
      # (TESTING.md 4) and Playwright e2e (TESTING.md 6) go here once the cluster
      # is reachable (see docs/coordination/WORKBOARD.md).
