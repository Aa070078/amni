# Amni platform local deps: Postgres + Redis.
# Production compose lives under infra/docker/compose.prod.yaml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amni}
      POSTGRES_DB: ${POSTGRES_DB:-amni_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amni-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amni}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - amni-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  amni-postgres:
  amni-redis:
