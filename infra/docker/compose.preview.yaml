services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amni
      POSTGRES_PASSWORD: amni
      POSTGRES_DB: amni_platform
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amni"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    image: amni-api:test
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma && node_modules/.bin/tsx apps/api/scripts/seed-demo-user.ts && node apps/api/dist/main.js"]
    environment:
      DATABASE_URL: postgresql://amni:amni@postgres:5432/amni_platform
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
      PLATFORM_URL: http://localhost:3000
      PLATFORM_DOMAIN: localhost
      ACCESS_TOKEN_SECRET: deploy-test-secret-that-is-longer-than-32-chars
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: amni-web:test
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
